  rerating_analysis_source: "template/06-估值与安全边际.md#rerating-analysis"
  decision_feedback_source: "template/07-决策流程与持仓管理.md#decision-feedback"
  report_contract: "template/00-报告输出契约.md"
  data_validation_schema: "config/data_validation_template.yaml"
