rules:
  primary_framework_required: true
  secondary_framework_optional: true
  surface_pe_and_ttm_required_when_applicable: true
  disclosure_aware_ttm_required: true
  valuation_currency_and_fx_required: true
  reported_fcf_and_maintenance_fcf_separate: true
  cash_return_dashboard_required: true
  multi_period_fcf_required_when_available: true
  immediate_cash_availability_required: true
  position_limit_source: "template/07-决策流程与持仓管理.md"
  shareholder_relationship_required: true
  star_market_and_chinext_default_exclusion: true
  historical_price_anchor_forbidden: true
  watchlist_card_projection_only: true
  top_tier_position_rule_enabled: true
  # r6分红优先门槛：只适用于普通经营公司的收息新买入/顶格路径
  pure_income_new_buy_tax_after_ordinary_dividend_yield_min: 0.05
  pure_income_attractive_tax_after_ordinary_dividend_yield_range: "0.08-0.10"
  special_dividend_excluded_from_sustainable_yield: true
  top_tier_distribution_gate_enabled: true
  top_tier_tax_after_ordinary_dividend_yield_min: 0.05
  top_tier_cross_period_actual_fcf_to_ordinary_dividend_min: 1.0
  top_tier_net_cash_100pct_required: false
  existing_holding_forced_sell_on_price_yield_below_5: false
